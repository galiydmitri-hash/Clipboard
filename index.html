<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Удобный и быстрый буфер обмена между Windows, Android и iOS. Сохраняйте текст и получайте доступ с любого устройства.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <title>Clipboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="Image/Clipboard-logo.png" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="error-message"></div>

  <div id="auth-section">
    <h3>Вход / Регистрация</h3>
    <div class="inputcon">
      <input type="email" id="email" placeholder="Ваш Email">
      <input type="password" id="password" placeholder="Пароль">
    </div>
    <div class="btncon">
      <button id="btn-login">Войти</button>
      <button id="btn-signup">Зарегистрироваться</button>
    </div>
  </div>

  <header>
    <h3>Cl<span style="color: var(--accent)">i</span>pboard</h3>
    <button class="settings-btn">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill="#8B5CF6" fill-rule="evenodd" clip-rule="evenodd" d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.39-1.08-.73-1.69-.98l-.37-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.37 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.39 1.08.73 1.69.98l.37 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.37-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.22.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
      </svg>
    </button>
  </header>

  <div class="settings-container">
    <button class="close-settings-btn">  
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 6L18 18M18 6L6 18" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>
    <p>Вы вошли как: <b id="user-email"></b></p>
    <button id="btn-logout">Выйти</button>
  </div>

  <div id="app-section" class="hidden">  
    <div class="text-container">
      <div 
        contenteditable="true" 
        class="editable-field" 
        id="editor"
      >Введите заметку...</div>
      <input type="hidden" name="myText" id="clip-text">
      <button id="btn-save">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none">
          <path d="M12 19V6M12 6L6.5 11.5M12 6L17.5 11.5" stroke="rgb(229, 231, 235)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="search-container">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" class="search-icon">
        <circle cx="10.5" cy="10.5" r="6" stroke="#2b344b" stroke-width="1.8"/>
        <path d="M15 15L20 20" stroke="#2b344b" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <input type="text" class="search-area" placeholder="Поиск...">
    </div>

    <ul class="list">
      <li><button class="btn all choice" data-filter="all">Все</button></li>
      <li><button class="btn text" data-filter="text">Текст</button></li>
      <li><button class="btn code" data-filter="code">Код</button></li>
      <li><button class="btn link" data-filter="link">Ссылка</button></li>
    </ul>

    <div id="clips-list"></div>
    <div class="info-about-all-items"></div>
  </div>

  <script src="JS/script.js" type="module"></script>
</body>
</html>
